baseURL = '/'
locale = 'en-us'
title = 'Minimal NeuralSAT'
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  description = 'A minimal functional NeuralSAT: how each layer of a neural network is bounded, and how branch and bound and DPLL(T) use those bounds to verify a robustness property.'

# the shortcodes of the walkthrough emit HTML (details, div); the content is ours
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['$', '$']]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

