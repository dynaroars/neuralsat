[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralsat"
version = "0.2.17"
authors = [
    {name="Thanh Le", email="thanhbok26b@gmail.com"},
]
description = "NeuralSAT: A DPLL(T) Framework for Verifying Deep Neural Networks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beartype>=0.16.4",
    "certifi>=2022.12.7",
    "charset-normalizer>=2.1.1",
    "coloredlogs>=15.0.1",
    "filelock>=3.9.0",
    "flatbuffers>=23.5.26",
    "fsspec>=2023.4.0",
    "gurobipy>=11.0.0",
    "humanfriendly>=10.0",
    "idna>=3.4",
    "Jinja2>=3.1.2",
    "MarkupSafe>=2.1.3",
    "mpmath>=1.2.1",
    "networkx>=3.0",
    "numpy>=1.24.2",
    "onnx>=1.15.0",
    "onnxsim>=0.4.36",
    "onnxruntime>=1.16.3",
    "packaging>=23.2",
    "Pillow>=9.3.0",
    "protobuf>=4.25.1,<6.0",
    "psutil>=5.9.6",
    "requests>=2.28.1",
    "sortedcontainers>=2.4.0",
    "sympy>=1.11.1",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.66.1",
    "typing_extensions>=4.8.0",
    "urllib3>=1.26.13",
    "termcolor>=2.4.0",
    "joblib>=1.4.2",
    "torchaudio>=2.9.0",
    "scipy>=1.10.1",
]

[project.urls]
Homepage = "https://github.com/dynaroars/neuralsat"
Issues = "https://github.com/dynaroars/neuralsat/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.uv.sources]
haioc = { path = "third_party/haioc", editable = true }