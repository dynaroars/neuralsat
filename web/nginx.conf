# NeuralSAT Nginx Reverse Proxy Configuration for Subdomain
#
# Save this file to /etc/nginx/sites-available/neuralsat
# Then link it: ln -sf /etc/nginx/sites-available/neuralsat /etc/nginx/sites-enabled/
# And reload Nginx: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    
    server_name neuralsat.roars.dev;

    # Frontend Static Files
    location / {
        alias /home/webapp/neuralsat/web/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Premium caching settings for static assets
        location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Backend API Server Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important: increase timeouts for long verification tasks
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        
        # Limit for uploading large neural networks (.onnx files)
        client_max_body_size 100M;
    }
}
